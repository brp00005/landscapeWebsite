name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or 'master' - replace with your primary branch name, e.g., 'master' or 'main'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Or your specific Node.js version, e.g., '18', '22'

      - name: Install Dependencies
        run: npm ci # 'npm ci' is recommended for CI/CD, ensures clean install

      - name: Set homepage in package.json
        # This step ensures homepage is correctly set for the build in CI
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const pkgPath = path.join(process.cwd(), 'package.json');
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.homepage = 'https://brp00005.github.io/landscapeWebsite/';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          "

      - name: Build React App
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          # keep_history: true # Uncomment if you want to keep Git history on gh-pages branch